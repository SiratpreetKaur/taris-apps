<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YellowNotes - Organize Your Thoughts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #facc15;
            --primary-dark: #eab308;
            --primary-light: #fef9c3;
            --bg: #fefce8;
            --text-dark: #422006;
            --text-muted: #713f12;
            --white: #ffffff;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-dark);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        header {
            background-color: var(--primary);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .logo {
            font-family: 'Permanent Marker', cursive;
            font-size: 1.8rem;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-container {
            flex-grow: 1;
            max-width: 500px;
            margin: 0 2rem;
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 0.7rem 1rem 0.7rem 2.5rem;
            border-radius: 12px;
            border: 2px solid transparent;
            background: rgba(255, 255, 255, 0.8);
            outline: none;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .search-container input:focus {
            background: white;
            border-color: var(--text-dark);
            box-shadow: var(--shadow);
        }

        .search-container i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .btn-add {
            background-color: var(--text-dark);
            color: var(--primary);
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: var(--shadow);
        }

        .btn-add:hover {
            transform: translateY(-2px);
            background-color: #000;
        }

        .btn-add:active {
            transform: translateY(0);
        }

        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .note-card {
            background-color: var(--white);
            border-radius: 16px;
            padding: 1.5rem;
            position: relative;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid var(--primary-light);
            display: flex;
            flex-direction: column;
            min-height: 200px;
            box-shadow: var(--shadow);
        }

        .note-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--card-shadow);
        }

        .note-card.pinned {
            border: 2px solid var(--primary);
        }

        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .note-title {
            font-weight: 700;
            font-size: 1.2rem;
            word-break: break-word;
            padding-right: 2rem;
        }

        .note-body {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
            flex-grow: 1;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .note-footer {
            margin-top: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .note-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            transition: color 0.2s;
            padding: 5px;
        }

        .action-btn:hover {
            color: var(--text-dark);
        }

        .pin-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 1.1rem;
        }

        .pin-btn.active {
            color: var(--primary-dark);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(66, 32, 6, 0.4);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal {
            background: white;
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal h2 {
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid var(--primary-light);
            border-radius: 10px;
            outline: none;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--primary);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn-cancel {
            background: #f1f5f9;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-save {
            background: var(--primary);
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-dark);
        }

        .empty-state {
            text-align: center;
            margin-top: 5rem;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }
            .search-container {
                margin: 0;
                width: 100%;
            }
            .controls {
                flex-direction: column;
                gap: 1rem;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fas fa-sticky-note"></i>
            YellowNotes
        </div>
        <div class="search-container">
            <i class="fas fa-search"></i>
            <input type="text" id="search-input" placeholder="Search your thoughts...">
        </div>
    </header>

    <div class="container">
        <div class="controls">
            <h1>My Notes</h1>
            <button class="btn-add" onclick="openModal()">
                <i class="fas fa-plus"></i> New Note
            </button>
        </div>

        <div id="notes-grid" class="notes-grid">
            <!-- Notes will be injected here -->
        </div>

        <div id="empty-state" class="empty-state" style="display: none;">
            <i class="fas fa-lightbulb"></i>
            <h3>No notes yet?</h3>
            <p>Click "New Note" to start capturing your brilliant ideas!</p>
        </div>
    </div>

    <!-- Note Modal -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal">
            <h2 id="modal-title-text">Create New Note</h2>
            <input type="hidden" id="edit-id">
            <div class="form-group">
                <label>Title</label>
                <input type="text" id="note-title-input" placeholder="Title of your note...">
            </div>
            <div class="form-group">
                <label>Content</label>
                <textarea id="note-content-input" rows="6" placeholder="Write your thoughts here..."></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-save" onclick="saveNote()">Save Note</button>
            </div>
        </div>
    </div>

    <script>
        // State Management
        let notes = JSON.parse(localStorage.getItem('yellow_notes_data')) || [];
        let isEditing = false;

        // DOM Elements
        const notesGrid = document.getElementById('notes-grid');
        const emptyState = document.getElementById('empty-state');
        const modalOverlay = document.getElementById('modal-overlay');
        const searchInput = document.getElementById('search-input');
        
        const noteTitleInput = document.getElementById('note-title-input');
        const noteContentInput = document.getElementById('note-content-input');
        const editIdInput = document.getElementById('edit-id');
        const modalTitleText = document.getElementById('modal-title-text');

        // Functions
        function init() {
            renderNotes();
            
            // Search listener
            searchInput.addEventListener('input', () => {
                renderNotes(searchInput.value);
            });

            // Close modal on outside click
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) closeModal();
            });
        }

        function openModal(editId = null) {
            if (editId) {
                isEditing = true;
                const note = notes.find(n => n.id === editId);
                modalTitleText.innerText = "Edit Note";
                editIdInput.value = note.id;
                noteTitleInput.value = note.title;
                noteContentInput.value = note.content;
            } else {
                isEditing = false;
                modalTitleText.innerText = "Create New Note";
                editIdInput.value = "";
                noteTitleInput.value = "";
                noteContentInput.value = "";
            }
            modalOverlay.style.display = 'flex';
            noteTitleInput.focus();
        }

        function closeModal() {
            modalOverlay.style.display = 'none';
        }

        function saveNote() {
            const title = noteTitleInput.value.trim();
            const content = noteContentInput.value.trim();

            if (!title && !content) {
                alert("Note cannot be empty!");
                return;
            }

            if (isEditing) {
                const id = editIdInput.value;
                notes = notes.map(n => n.id === id ? { 
                    ...n, 
                    title, 
                    content, 
                    updatedAt: new Date().toISOString() 
                } : n);
            } else {
                const newNote = {
                    id: Date.now().toString(),
                    title,
                    content,
                    pinned: false,
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                };
                notes.unshift(newNote);
            }

            saveToLocalStorage();
            renderNotes();
            closeModal();
        }

        function deleteNote(id) {
            if (confirm("Are you sure you want to delete this note?")) {
                notes = notes.filter(n => n.id !== id);
                saveToLocalStorage();
                renderNotes();
            }
        }

        function togglePin(id) {
            notes = notes.map(n => n.id === id ? { ...n, pinned: !n.pinned } : n);
            saveToLocalStorage();
            renderNotes();
        }

        function saveToLocalStorage() {
            localStorage.setItem('yellow_notes_data', JSON.stringify(notes));
        }

        function formatDate(dateString) {
            const options = { month: 'short', day: 'numeric', year: 'numeric' };
            return new Date(dateString).toLocaleDateString(undefined, options);
        }

        function renderNotes(filter = "") {
            notesGrid.innerHTML = "";
            
            // Filter and Sort (Pinned first, then most recent)
            let filteredNotes = notes.filter(n => 
                n.title.toLowerCase().includes(filter.toLowerCase()) || 
                n.content.toLowerCase().includes(filter.toLowerCase())
            );

            filteredNotes.sort((a, b) => {
                if (a.pinned === b.pinned) {
                    return new Date(b.updatedAt) - new Date(a.updatedAt);
                }
                return a.pinned ? -1 : 1;
            });

            if (filteredNotes.length === 0) {
                emptyState.style.display = 'block';
                notesGrid.style.display = 'none';
            } else {
                emptyState.style.display = 'none';
                notesGrid.style.display = 'grid';

                filteredNotes.forEach(note => {
                    const card = document.createElement('div');
                    card.className = `note-card ${note.pinned ? 'pinned' : ''}`;
                    card.innerHTML = `
                        <button class="action-btn pin-btn ${note.pinned ? 'active' : ''}" onclick="togglePin('${note.id}')" title="Pin Note">
                            <i class="${note.pinned ? 'fas' : 'far'} fa-thumbtack"></i>
                        </button>
                        <div class="note-header">
                            <div class="note-title">${note.title || 'Untitled'}</div>
                        </div>
                        <div class="note-body">${note.content}</div>
                        <div class="note-footer">
                            <span>${formatDate(note.updatedAt)}</span>
                            <div class="note-actions">
                                <button class="action-btn" onclick="openModal('${note.id}')" title="Edit">
                                    <i class="fas fa-pen"></i>
                                </button>
                                <button class="action-btn" onclick="deleteNote('${note.id}')" title="Delete">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    `;
                    notesGrid.appendChild(card);
                });
            }
        }

        // Initialize App
        init();
    </script>
</body>
</html>
