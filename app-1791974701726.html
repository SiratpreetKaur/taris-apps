<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TARIS Neon Piano - Rhythm Master</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --piano-bg: #1e293b;
            --white-key: #f8fafc;
            --black-key: #334155;
            --accent: #38bdf8;
            --neon-pink: #f472b6;
            --neon-green: #4ade80;
            --key-width: 60px;
            --key-height: 200px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        /* Header & HUD */
        #hud {
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.9);
            z-index: 100;
        }

        .stats {
            display: flex;
            gap: 30px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
        }

        /* Game Container */
        #game-stage {
            position: relative;
            flex-grow: 1;
            width: 100%;
            max-width: 800px;
            background: linear-gradient(to bottom, rgba(56, 189, 248, 0.05), transparent);
            overflow: hidden;
            border-left: 2px solid rgba(255,255,255,0.05);
            border-right: 2px solid rgba(255,255,255,0.05);
        }

        #note-lane-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
        }

        .lane {
            flex: 1;
            border-right: 1px solid rgba(255, 255, 255, 0.03);
            position: relative;
        }

        .falling-note {
            position: absolute;
            width: 80%;
            left: 10%;
            border-radius: 4px;
            background: var(--accent);
            box-shadow: 0 0 15px var(--accent);
            transition: opacity 0.1s;
        }

        /* Piano UI */
        #piano-wrapper {
            background: var(--piano-bg);
            padding: 20px;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 900px;
            position: relative;
        }

        #piano {
            display: flex;
            justify-content: center;
            position: relative;
            height: var(--key-height);
        }

        .key {
            position: relative;
            cursor: pointer;
            transition: all 0.1s;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 10px;
            font-weight: bold;
            font-size: 0.7rem;
        }

        .white-key {
            width: var(--key-width);
            height: var(--key-height);
            background: var(--white-key);
            border: 1px solid #ddd;
            border-radius: 0 0 5px 5px;
            color: #64748b;
            z-index: 1;
        }

        .white-key.active {
            background: #e2e8f0;
            transform: translateY(2px);
            box-shadow: inset 0 0 15px var(--accent);
        }

        .black-key {
            width: calc(var(--key-width) * 0.6);
            height: calc(var(--key-height) * 0.6);
            background: var(--black-key);
            margin-left: calc(var(--key-width) * -0.3);
            margin-right: calc(var(--key-width) * -0.3);
            z-index: 2;
            border-radius: 0 0 3px 3px;
            color: white;
        }

        .black-key.active {
            background: #000;
            transform: translateY(2px);
            box-shadow: inset 0 0 10px var(--neon-pink);
        }

        .key-label {
            pointer-events: none;
        }

        /* Overlay */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            text-align: center;
        }

        .btn {
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--accent);
        }

        .hit-effect {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(to top, var(--accent), transparent);
            opacity: 0;
            pointer-events: none;
        }

        .combo-text {
            position: absolute;
            font-size: 4rem;
            font-weight: 900;
            color: var(--neon-pink);
            opacity: 0;
            pointer-events: none;
            text-shadow: 0 0 20px var(--neon-pink);
        }

        @keyframes floating {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }

        .floating {
            animation: floating 3s ease-in-out infinite;
        }
    </style>
</head>
<body>

    <div id="hud">
        <h1 style="margin:0; font-size: 1.5rem; color: var(--accent);">TARIS <span style="color:white">PIANO RHYTHM</span></h1>
        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">Score</div>
                <div id="score" class="stat-value">000000</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Combo</div>
                <div id="combo" class="stat-value">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Accuracy</div>
                <div id="accuracy" class="stat-value">100%</div>
            </div>
        </div>
    </div>

    <div id="game-stage">
        <div id="note-lane-container"></div>
        <div id="combo-display" class="combo-text">COMBO!</div>
    </div>

    <div id="piano-wrapper">
        <div id="piano"></div>
    </div>

    <div id="overlay">
        <h1 class="floating" style="font-size: 3rem; margin-bottom: 10px;">NEON PIANO</h1>
        <p style="color: #94a3b8; max-width: 400px; margin-bottom: 30px;">
            Press the keys when the notes reach the bottom. 
            Use your mouse or keyboard (A S D F G H J K L ...).
        </p>
        <button id="start-btn" class="btn">Start Playing</button>
    </div>

    <script>
        const NOTES = [
            { note: 'C4', key: 'A', freq: 261.63, type: 'white' },
            { note: 'C#4', key: 'W', freq: 277.18, type: 'black' },
            { note: 'D4', key: 'S', freq: 293.66, type: 'white' },
            { note: 'D#4', key: 'E', freq: 311.13, type: 'black' },
            { note: 'E4', key: 'D', freq: 329.63, type: 'white' },
            { note: 'F4', key: 'F', freq: 349.23, type: 'white' },
            { note: 'F#4', key: 'T', freq: 369.99, type: 'black' },
            { note: 'G4', key: 'G', freq: 392.00, type: 'white' },
            { note: 'G#4', key: 'Y', freq: 415.30, type: 'black' },
            { note: 'A4', key: 'H', freq: 440.00, type: 'white' },
            { note: 'A#4', key: 'U', freq: 466.16, type: 'black' },
            { note: 'B4', key: 'J', freq: 493.88, type: 'white' },
            { note: 'C5', key: 'K', freq: 523.25, type: 'white' }
        ];

        const pianoEl = document.getElementById('piano');
        const laneContainer = document.getElementById('note-lane-container');
        const scoreEl = document.getElementById('score');
        const comboEl = document.getElementById('combo');
        const accuracyEl = document.getElementById('accuracy');
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('overlay');

        let audioCtx;
        let score = 0;
        let combo = 0;
        let hits = 0;
        let totalNotes = 0;
        let gameActive = false;
        let fallingNotes = [];
        let activeOscillators = {};

        // Audio System
        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playNote(freq) {
            if (!audioCtx) return;
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.8);
            
            return osc;
        }

        // Initialize UI
        function createPiano() {
            NOTES.forEach((n, index) => {
                const keyEl = document.createElement('div');
                keyEl.className = `key ${n.type}-key`;
                keyEl.dataset.note = n.note;
                keyEl.innerHTML = `<span class="key-label">${n.key}</span><div class="hit-effect"></div>`;
                
                keyEl.addEventListener('mousedown', () => handleKeyPress(n.note));
                pianoEl.appendChild(keyEl);

                // Create lanes
                const lane = document.createElement('div');
                lane.className = 'lane';
                lane.dataset.note = n.note;
                laneContainer.appendChild(lane);
            });
        }

        // Game Logic
        function handleKeyPress(noteName) {
            const noteData = NOTES.find(n => n.note === noteName);
            const keyEl = document.querySelector(`.key[data-note="${noteName}"]`);
            
            if (keyEl) {
                keyEl.classList.add('active');
                setTimeout(() => keyEl.classList.remove('active'), 100);
                
                // Pulse effect
                const effect = keyEl.querySelector('.hit-effect');
                effect.style.opacity = '1';
                setTimeout(() => effect.style.opacity = '0', 200);
            }

            playNote(noteData.freq);

            if (gameActive) {
                checkHit(noteName);
            }
        }

        function checkHit(noteName) {
            const laneHeight = laneContainer.offsetHeight;
            const hitZoneMin = laneHeight - 120;
            const hitZoneMax = laneHeight;
            
            let hitFound = false;
            
            for (let i = 0; i < fallingNotes.length; i++) {
                const note = fallingNotes[i];
                if (note.note === noteName && !note.hit) {
                    const notePos = note.y + note.height;
                    
                    if (notePos >= hitZoneMin && note.y <= hitZoneMax) {
                        note.hit = true;
                        note.el.style.opacity = '0';
                        registerHit(true);
                        hitFound = true;
                        break;
                    }
                }
            }
            
            if (!hitFound) {
                // optional: penalty for pressing when no note is there
            }
        }

        function registerHit(isHit) {
            if (isHit) {
                score += 100 + (combo * 10);
                combo++;
                hits++;
                if (combo > 5 && combo % 5 === 0) showComboEffect();
            } else {
                combo = 0;
            }
            
            totalNotes++;
            updateHUD();
        }

        function updateHUD() {
            scoreEl.textContent = score.toString().padStart(6, '0');
            comboEl.textContent = combo;
            const acc = totalNotes === 0 ? 100 : Math.round((hits / totalNotes) * 100);
            accuracyEl.textContent = acc + '%';
        }

        function showComboEffect() {
            const comboText = document.getElementById('combo-display');
            comboText.style.left = Math.random() * 60 + 20 + '%';
            comboText.style.top = Math.random() * 40 + 20 + '%';
            comboText.style.opacity = '1';
            comboText.textContent = combo + ' COMBO!';
            setTimeout(() => comboText.style.opacity = '0', 500);
        }

        function spawnNote() {
            if (!gameActive) return;
            
            const randomNoteIndex = Math.floor(Math.random() * NOTES.length);
            const noteData = NOTES[randomNoteIndex];
            const lane = laneContainer.children[randomNoteIndex];
            
            const noteEl = document.createElement('div');
            noteEl.className = 'falling-note';
            noteEl.style.height = '40px';
            noteEl.style.top = '-40px';
            lane.appendChild(noteEl);
            
            fallingNotes.push({
                el: noteEl,
                note: noteData.note,
                y: -40,
                height: 40,
                hit: false,
                laneIndex: randomNoteIndex
            });

            // Schedule next spawn
            const nextSpawn = Math.max(400, 1000 - (score / 100));
            setTimeout(spawnNote, nextSpawn);
        }

        function gameLoop() {
            if (!gameActive) return;

            const speed = 4 + (score / 5000);
            const laneHeight = laneContainer.offsetHeight;

            for (let i = fallingNotes.length - 1; i >= 0; i--) {
                const note = fallingNotes[i];
                note.y += speed;
                note.el.style.top = note.y + 'px';

                // Missed note
                if (note.y > laneHeight && !note.hit) {
                    note.hit = true; // prevent double penalty
                    registerHit(false);
                    note.el.remove();
                    fallingNotes.splice(i, 1);
                } else if (note.y > laneHeight) {
                    note.el.remove();
                    fallingNotes.splice(i, 1);
                }
            }

            requestAnimationFrame(gameLoop);
        }

        // Event Listeners
        window.addEventListener('keydown', (e) => {
            const key = e.key.toUpperCase();
            const noteObj = NOTES.find(n => n.key === key);
            if (noteObj) {
                handleKeyPress(noteObj.note);
            }
        });

        startBtn.addEventListener('click', () => {
            initAudio();
            overlay.style.display = 'none';
            gameActive = true;
            score = 0;
            combo = 0;
            hits = 0;
            totalNotes = 0;
            updateHUD();
            spawnNote();
            gameLoop();
        });

        // Init
        createPiano();

    </script>
</body>
</html>
