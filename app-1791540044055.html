<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bubble Pop Zen</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --primary: #38bdf8;
            --accent: #f472b6;
            --danger: #ef4444;
            --text: #f8fafc;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--text);
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            overflow: hidden;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 100;
            pointer-events: none;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .stat-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            display: block;
        }

        #lives-container {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }

        .heart {
            color: var(--danger);
            font-size: 1.2rem;
            transition: transform 0.3s ease;
        }

        .heart.lost {
            filter: grayscale(1) opacity(0.3);
            transform: scale(0.8);
        }

        /* Bubbles */
        .bubble {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease-out;
            will-change: transform, bottom;
            box-shadow: inset -10px -10px 15px rgba(0,0,0,0.2),
                        inset 10px 10px 15px rgba(255,255,255,0.4),
                        0 5px 15px rgba(0,0,0,0.2);
        }

        .bubble::after {
            content: '';
            position: absolute;
            top: 20%;
            left: 20%;
            width: 25%;
            height: 25%;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
        }

        .bubble-pop {
            animation: pop 0.3s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        /* Menus */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.2));
        }

        .btn {
            background: var(--primary);
            color: var(--bg-color);
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
            pointer-events: auto;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.6);
        }

        .btn:active {
            transform: translateY(0);
        }

        #game-over-screen { display: none; }

        .floating {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Particle effect */
        .particle {
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
            animation: particle-fly 0.6s ease-out forwards;
        }

        @keyframes particle-fly {
            to {
                transform: translate(var(--dx), var(--dy)) scale(0);
                opacity: 0;
            }
        }

        .hidden { display: none !important; }

        /* Mobile specific adjustments */
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .stat-value { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- UI -->
        <div id="ui-layer">
            <div class="stat-box">
                <span class="stat-label">Score</span>
                <span id="score-val" class="stat-value">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Lives</span>
                <div id="lives-container">
                    <span class="heart">❤</span>
                    <span class="heart">❤</span>
                    <span class="heart">❤</span>
                </div>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="overlay">
            <h1 class="floating">BUBBLE POP</h1>
            <p style="opacity: 0.8; max-width: 300px;">Don't let the bubbles reach the top! Pop the specials for bonus points.</p>
            <button id="start-btn" class="btn">START GAME</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="overlay">
            <h1>GAME OVER</h1>
            <div class="stat-box" style="margin-bottom: 20px;">
                <span class="stat-label">Final Score</span>
                <span id="final-score" class="stat-value">0</span>
            </div>
            <button id="restart-btn" class="btn">TRY AGAIN</button>
        </div>
    </div>

    <script>
        /**
         * BUBBLE POP GAME ENGINE
         */
        const gameContainer = document.getElementById('game-container');
        const scoreElement = document.getElementById('score-val');
        const livesContainer = document.getElementById('lives-container');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreElement = document.getElementById('final-score');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        // Game State
        let state = {
            score: 0,
            lives: 3,
            gameActive: false,
            speed: 1.5,
            spawnRate: 1000,
            lastSpawn: 0,
            bubbles: [],
            animationFrame: null,
            difficultyTimer: 0
        };

        // Audio Context for synthetic sounds (no external files needed)
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
        }

        function playPopSound(freq = 400, type = 'sine') {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        // Bubble Configuration
        const bubbleTypes = [
            { type: 'normal', color: 'rgba(56, 189, 248, 0.4)', border: '#38bdf8', score: 10, weight: 80 },
            { type: 'gold', color: 'rgba(250, 204, 21, 0.4)', border: '#facc15', score: 50, weight: 15 },
            { type: 'danger', color: 'rgba(239, 68, 68, 0.4)', border: '#ef4444', score: -20, weight: 5 }
        ];

        function getRandomType() {
            const rand = Math.random() * 100;
            let cumulative = 0;
            for (const b of bubbleTypes) {
                cumulative += b.weight;
                if (rand < cumulative) return b;
            }
            return bubbleTypes[0];
        }

        class Bubble {
            constructor() {
                const config = getRandomType();
                this.type = config.type;
                this.scoreValue = config.score;
                this.size = Math.random() * (80 - 40) + 40;
                this.x = Math.random() * (window.innerWidth - this.size);
                this.y = window.innerHeight + 100;
                this.speed = (Math.random() * 1 + state.speed) * (this.type === 'gold' ? 1.5 : 1);
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = Math.random() * 0.05 + 0.02;

                this.el = document.createElement('div');
                this.el.className = 'bubble';
                this.el.style.width = `${this.size}px`;
                this.el.style.height = `${this.size}px`;
                this.el.style.left = `${this.x}px`;
                this.el.style.backgroundColor = config.color;
                this.el.style.border = `2px solid ${config.border}`;
                
                this.el.addEventListener('mousedown', (e) => this.pop(e));
                this.el.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    this.pop(e);
                });

                gameContainer.appendChild(this.el);
            }

            update() {
                this.y -= this.speed;
                this.wobble += this.wobbleSpeed;
                const xOffset = Math.sin(this.wobble) * 2;
                this.el.style.transform = `translateY(${this.y - window.innerHeight}px) translateX(${xOffset}px)`;

                if (this.y + this.size < 0) {
                    if (this.type !== 'danger') loseLife();
                    this.remove();
                    return false;
                }
                return true;
            }

            pop(e) {
                if (!state.gameActive) return;
                
                state.score += this.scoreValue;
                if (state.score < 0) state.score = 0;
                scoreElement.innerText = state.score;

                if (this.type === 'danger') {
                    playPopSound(150, 'sawtooth');
                    loseLife();
                } else {
                    playPopSound(400 + (Math.random() * 400));
                }

                this.createParticles();
                this.el.classList.add('bubble-pop');
                this.el.style.pointerEvents = 'none';
                setTimeout(() => this.remove(), 300);
                
                // Remove from active array immediately to prevent double clicks
                const index = state.bubbles.indexOf(this);
                if (index > -1) state.bubbles.splice(index, 1);
            }

            createParticles() {
                const count = 8;
                for (let i = 0; i < count; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    const color = window.getComputedStyle(this.el).borderColor;
                    p.style.backgroundColor = color;
                    p.style.width = '8px';
                    p.style.height = '8px';
                    p.style.left = `${this.x + this.size/2}px`;
                    p.style.top = `${this.y - (this.size/2)}px`;
                    
                    const angle = (i / count) * Math.PI * 2;
                    const velocity = 50 + Math.random() * 50;
                    p.style.setProperty('--dx', `${Math.cos(angle) * velocity}px`);
                    p.style.setProperty('--dy', `${Math.sin(angle) * velocity}px`);
                    
                    gameContainer.appendChild(p);
                    setTimeout(() => p.remove(), 600);
                }
            }

            remove() {
                if (this.el.parentNode) {
                    this.el.parentNode.removeChild(this.el);
                }
            }
        }

        function loseLife() {
            state.lives--;
            updateLivesUI();
            
            // Screen shake
            gameContainer.style.animation = 'none';
            setTimeout(() => gameContainer.style.animation = 'shake 0.2s', 1);

            if (state.lives <= 0) {
                endGame();
            }
        }

        function updateLivesUI() {
            const hearts = livesContainer.querySelectorAll('.heart');
            hearts.forEach((heart, index) => {
                if (index >= state.lives) {
                    heart.classList.add('lost');
                } else {
                    heart.classList.remove('lost');
                }
            });
        }

        function spawn() {
            if (!state.gameActive) return;
            state.bubbles.push(new Bubble());
        }

        function gameLoop(timestamp) {
            if (!state.gameActive) return;

            // Handle Spawning
            if (timestamp - state.lastSpawn > state.spawnRate) {
                spawn();
                state.lastSpawn = timestamp;
                
                // Increase difficulty
                state.spawnRate = Math.max(400, 1000 - (state.score / 10));
                state.speed = Math.min(6, 1.5 + (state.score / 500));
            }

            // Update Bubbles
            for (let i = state.bubbles.length - 1; i >= 0; i--) {
                const alive = state.bubbles[i].update();
                if (!alive) {
                    state.bubbles.splice(i, 1);
                }
            }

            state.animationFrame = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            initAudio();
            state.score = 0;
            state.lives = 3;
            state.gameActive = true;
            state.speed = 1.5;
            state.spawnRate = 1000;
            state.bubbles.forEach(b => b.remove());
            state.bubbles = [];
            
            scoreElement.innerText = '0';
            updateLivesUI();
            
            startScreen.classList.add('hidden');
            gameOverScreen.style.display = 'none';
            
            state.lastSpawn = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            state.gameActive = false;
            cancelAnimationFrame(state.animationFrame);
            finalScoreElement.innerText = state.score;
            gameOverScreen.style.display = 'flex';
            
            // Cleanup particles
            document.querySelectorAll('.particle').forEach(p => p.remove());
        }

        // Event Listeners
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        // Visual shake animation
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-10px); }
                75% { transform: translateX(10px); }
            }
        `;
        document.head.appendChild(style);

    </script>
</body>
</html>
