<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bubble Pop - Taris Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --primary-color: #38bdf8;
            --accent-color: #f472b6;
            --text-color: #f8fafc;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Quicksand', sans-serif;
            color: var(--text-color);
        }

        canvas {
            display: block;
            touch-action: none;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            z-index: 10;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-size: 1.5rem;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        #score-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #timer-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            min-width: 100px;
            text-align: center;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.3s ease;
            pointer-events: auto;
        }

        .hidden {
            display: none;
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 10px rgba(56, 189, 248, 0.3));
        }

        .btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: inherit;
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.4);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px -5px rgba(56, 189, 248, 0.5);
        }

        .btn:active {
            transform: translateY(0);
        }

        #game-over-screen p {
            font-size: 1.5rem;
            margin-bottom: 2rem;
        }

        .high-score {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="stats">
            <div id="score-container">Score: <span id="score">0</span></div>
            <div id="timer-container"><span id="timer">60</span>s</div>
        </div>
    </div>

    <div id="start-screen" class="screen">
        <h1>Bubble Pop</h1>
        <p style="margin-bottom: 2rem; opacity: 0.8;">Pop as many as you can before time runs out!</p>
        <button class="btn" onclick="startGame()">START GAME</button>
        <div class="high-score">High Score: <span id="high-score-display">0</span></div>
    </div>

    <div id="game-over-screen" class="screen hidden">
        <h1 style="font-size: 3rem;">Time's Up!</h1>
        <p>Final Score: <span id="final-score">0</span></p>
        <button class="btn" onclick="startGame()">PLAY AGAIN</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const finalScoreEl = document.getElementById('final-score');
        const highScoreEl = document.getElementById('high-score-display');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');

        let width, height;
        let score = 0;
        let timeLeft = 60;
        let gameActive = false;
        let bubbles = [];
        let particles = [];
        let spawnRate = 800; // ms
        let lastSpawn = 0;
        let animationId;

        // Colors for bubbles
        const colors = [
            'hsla(199, 89%, 60%, 0.6)', // Blue
            'hsla(330, 81%, 70%, 0.6)', // Pink
            'hsla(270, 70%, 65%, 0.6)', // Purple
            'hsla(160, 84%, 39%, 0.6)', // Green
            'hsla(37, 90%, 61%, 0.6)'   // Yellow
        ];

        class Bubble {
            constructor() {
                this.radius = Math.random() * (45 - 25) + 25;
                this.x = Math.random() * (width - this.radius * 2) + this.radius;
                this.y = height + this.radius * 2;
                this.speed = Math.random() * (3.5 - 1.5) + 1.5;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.wiggle = Math.random() * 100;
                this.popped = false;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                
                // Highlight
                const gradient = ctx.createRadialGradient(
                    this.x - this.radius/3, this.y - this.radius/3, this.radius/10,
                    this.x, this.y, this.radius
                );
                gradient.addColorStop(0, 'rgba(255, 255, 255, 0.4)');
                gradient.addColorStop(0.3, this.color);
                gradient.addColorStop(1, 'rgba(255, 255, 255, 0.1)');
                
                ctx.fillStyle = gradient;
                ctx.fill();
                
                // Outline
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.closePath();
            }

            update() {
                this.y -= this.speed;
                this.x += Math.sin(this.wiggle + this.y / 50) * 1.5;
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.radius = Math.random() * 4 + 1;
                this.color = color;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10;
                this.alpha = 1;
                this.gravity = 0.2;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.vx *= 0.95;
                this.vy *= 0.95;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.02;
            }
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resize);
        resize();

        // Update high score display
        highScoreEl.innerText = localStorage.getItem('bubbleHighScore') || 0;

        function startGame() {
            score = 0;
            timeLeft = 60;
            bubbles = [];
            particles = [];
            gameActive = true;
            spawnRate = 800;
            
            scoreEl.innerText = score;
            timerEl.innerText = timeLeft;
            
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            
            const timerInterval = setInterval(() => {
                if (!gameActive) {
                    clearInterval(timerInterval);
                    return;
                }
                timeLeft--;
                timerEl.innerText = timeLeft;
                
                // Increase difficulty
                if (timeLeft % 10 === 0 && spawnRate > 200) {
                    spawnRate -= 100;
                }

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            animate(0);
        }

        function endGame() {
            gameActive = false;
            cancelAnimationFrame(animationId);
            finalScoreEl.innerText = score;
            gameOverScreen.classList.remove('hidden');
            
            const high = localStorage.getItem('bubbleHighScore') || 0;
            if (score > high) {
                localStorage.setItem('bubbleHighScore', score);
                highScoreEl.innerText = score;
            }
        }

        function createPop(x, y, color) {
            for (let i = 0; i < 12; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function animate(timestamp) {
            if (!gameActive) return;

            ctx.clearRect(0, 0, width, height);

            // Spawning
            if (timestamp - lastSpawn > spawnRate) {
                bubbles.push(new Bubble());
                lastSpawn = timestamp;
            }

            // Update & Draw Bubbles
            for (let i = bubbles.length - 1; i >= 0; i--) {
                const b = bubbles[i];
                b.update();
                b.draw();

                // Remove off-screen
                if (b.y + b.radius < 0) {
                    bubbles.splice(i, 1);
                }
            }

            // Update & Draw Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            animationId = requestAnimationFrame(animate);
        }

        function handleInput(clientX, clientY) {
            if (!gameActive) return;

            for (let i = bubbles.length - 1; i >= 0; i--) {
                const b = bubbles[i];
                const dist = Math.hypot(clientX - b.x, clientY - b.y);
                
                if (dist < b.radius + 10) { // Slight padding for easier popping
                    createPop(b.x, b.y, b.color);
                    bubbles.splice(i, 1);
                    score += 10;
                    scoreEl.innerText = score;
                    break; // Pop one bubble at a time per click
                }
            }
        }

        canvas.addEventListener('mousedown', (e) => handleInput(e.clientX, e.clientY));
        canvas.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            handleInput(touch.clientX, touch.clientY);
        });

    </script>
</body>
</html>
