<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TARIS OS | Productivity Suite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --success: #22c55e;
            --border: #334155;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .light-mode {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent: #2563eb;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background-color: var(--card-bg);
        }

        .logo {
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -0.025em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--accent);
            border-radius: 8px;
            display: grid;
            place-items: center;
            color: white;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        button {
            cursor: pointer;
            border: none;
            outline: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            background: var(--border);
            color: var(--text-primary);
        }

        .btn-icon:hover {
            background: var(--accent);
            color: white;
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 2rem;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            flex-grow: 1;
        }

        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* POMODORO TIMER */
        .timer-display {
            text-align: center;
            padding: 2rem 0;
        }

        .timer-digits {
            font-family: 'JetBrains Mono', monospace;
            font-size: 4rem;
            font-weight: 700;
            color: var(--accent);
        }

        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            padding: 0.75rem 1.5rem;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.75rem 1.5rem;
        }

        .btn-outline:hover {
            background: var(--border);
        }

        /* TODO LIST */
        .todo-input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        input[type="text"], textarea {
            flex-grow: 1;
            background: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-family: inherit;
        }

        input:focus {
            outline: 2px solid var(--accent);
            border-color: transparent;
        }

        .todo-list {
            list-style: none;
            max-height: 400px;
            overflow-y: auto;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0.75rem;
            border-bottom: 1px solid var(--border);
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .todo-item:last-child {
            border-bottom: none;
        }

        .todo-item.completed span {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .delete-btn {
            margin-left: auto;
            color: var(--text-secondary);
            background: none;
            padding: 4px;
        }

        .delete-btn:hover {
            color: var(--danger);
        }

        /* NOTES */
        #note-editor {
            width: 100%;
            min-height: 200px;
            resize: vertical;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        /* CLOCK & STATUS */
        .status-bar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .clock-widget {
            text-align: center;
        }

        #clock-time {
            font-size: 2.5rem;
            font-weight: 700;
        }

        #clock-date {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* FOOTER */
        footer {
            padding: 1.5rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
            margin-top: auto;
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <div class="logo-icon">T</div>
            TARIS OS
        </div>
        <div class="header-actions">
            <button class="btn-icon" id="theme-toggle" title="Toggle Dark/Light Mode">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            </button>
            <button class="btn-primary" onclick="exportData()">Export Data</button>
        </div>
    </header>

    <div class="main-container">
        <div class="dashboard-left">
            <!-- TASKS SECTION -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Tasks & Objectives</h2>
                    <span id="task-count" style="font-size: 0.8rem; color: var(--text-secondary)">0 tasks</span>
                </div>
                <div class="todo-input-group">
                    <input type="text" id="todo-input" placeholder="What needs to be done?">
                    <button class="btn-primary" id="add-todo">Add</button>
                </div>
                <ul class="todo-list" id="todo-list">
                    <!-- Tasks injected here -->
                </ul>
            </div>

            <!-- NOTES SECTION -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Quick Notes</h2>
                    <button class="btn-outline" style="padding: 4px 12px; font-size: 0.8rem" onclick="saveNotes()">Save</button>
                </div>
                <textarea id="note-editor" placeholder="Start typing your thoughts..."></textarea>
            </div>
        </div>

        <div class="dashboard-right">
            <!-- CLOCK -->
            <div class="card clock-widget">
                <div id="clock-time">00:00:00</div>
                <div id="clock-date">Monday, January 1st</div>
            </div>

            <!-- POMODORO -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Focus Timer</h2>
                </div>
                <div class="timer-display">
                    <div class="timer-digits" id="timer-display">25:00</div>
                    <div id="timer-status" style="margin-top: 0.5rem; color: var(--text-secondary); font-size: 0.8rem;">Ready to focus?</div>
                </div>
                <div class="timer-controls">
                    <button class="btn-primary" id="timer-start">Start</button>
                    <button class="btn-outline" id="timer-reset">Reset</button>
                </div>
            </div>

            <!-- STATS -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Productivity Stats</h2>
                </div>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <div style="display: flex; justify-content: space-between;">
                        <span style="color: var(--text-secondary)">Completed Tasks</span>
                        <span id="stats-completed" style="font-weight: 700; color: var(--success)">0</span>
                    </div>
                    <div style="display: flex; justify-content: space-between;">
                        <span style="color: var(--text-secondary)">Focus Sessions</span>
                        <span id="stats-pomos" style="font-weight: 700; color: var(--accent)">0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        TARIS OS &bull; Local Storage Protected &bull; <span id="current-year"></span>
    </footer>

    <script>
        // --- DATA STATE ---
        let state = {
            tasks: JSON.parse(localStorage.getItem('taris_tasks')) || [],
            notes: localStorage.getItem('taris_notes') || '',
            stats: JSON.parse(localStorage.getItem('taris_stats')) || { completed: 0, pomos: 0 },
            theme: localStorage.getItem('taris_theme') || 'dark'
        };

        // --- CORE UTILS ---
        const saveState = () => {
            localStorage.setItem('taris_tasks', JSON.stringify(state.tasks));
            localStorage.setItem('taris_notes', state.notes);
            localStorage.setItem('taris_stats', JSON.stringify(state.stats));
            localStorage.setItem('taris_theme', state.theme);
        };

        // --- THEME ENGINE ---
        const themeToggle = document.getElementById('theme-toggle');
        const applyTheme = () => {
            if (state.theme === 'light') {
                document.body.classList.add('light-mode');
            } else {
                document.body.classList.remove('light-mode');
            }
        };

        themeToggle.addEventListener('click', () => {
            state.theme = state.theme === 'dark' ? 'light' : 'dark';
            applyTheme();
            saveState();
        });

        // --- CLOCK ---
        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-US', { hour12: false });
            const dateStr = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            
            document.getElementById('clock-time').textContent = timeStr;
            document.getElementById('clock-date').textContent = dateStr;
            document.getElementById('current-year').textContent = now.getFullYear();
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- TODO LOGIC ---
        const todoInput = document.getElementById('todo-input');
        const todoList = document.getElementById('todo-list');
        const addTodoBtn = document.getElementById('add-todo');
        const taskCountEl = document.getElementById('task-count');
        const statsCompletedEl = document.getElementById('stats-completed');

        function renderTasks() {
            todoList.innerHTML = '';
            state.tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.className = `todo-item ${task.completed ? 'completed' : ''}`;
                li.innerHTML = `
                    <input type="checkbox" class="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})">
                    <span>${task.text}</span>
                    <button class="delete-btn" onclick="deleteTask(${index})">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                `;
                todoList.appendChild(li);
            });
            taskCountEl.textContent = `${state.tasks.length} tasks`;
            statsCompletedEl.textContent = state.stats.completed;
        }

        function addTask() {
            const text = todoInput.value.trim();
            if (text) {
                state.tasks.push({ text, completed: false });
                todoInput.value = '';
                saveState();
                renderTasks();
            }
        }

        window.toggleTask = (index) => {
            state.tasks[index].completed = !state.tasks[index].completed;
            if (state.tasks[index].completed) state.stats.completed++;
            else state.stats.completed = Math.max(0, state.stats.completed - 1);
            saveState();
            renderTasks();
        };

        window.deleteTask = (index) => {
            state.tasks.splice(index, 1);
            saveState();
            renderTasks();
        };

        addTodoBtn.addEventListener('click', addTask);
        todoInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addTask(); });

        // --- POMODORO TIMER ---
        let timerInterval;
        let timeLeft = 25 * 60;
        let isRunning = false;
        const timerDisplay = document.getElementById('timer-display');
        const timerStartBtn = document.getElementById('timer-start');
        const timerStatus = document.getElementById('timer-status');
        const statsPomosEl = document.getElementById('stats-pomos');

        function updateTimerDisplay() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            timerDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            if (isRunning) {
                clearInterval(timerInterval);
                timerStartBtn.textContent = 'Resume';
                timerStatus.textContent = 'Paused';
                isRunning = false;
            } else {
                isRunning = true;
                timerStartBtn.textContent = 'Pause';
                timerStatus.textContent = 'Deep Focus Mode';
                timerInterval = setInterval(() => {
                    timeLeft--;
                    updateTimerDisplay();
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        isRunning = false;
                        state.stats.pomos++;
                        saveState();
                        statsPomosEl.textContent = state.stats.pomos;
                        alert("Time's up! Take a break.");
                        resetTimer();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timeLeft = 25 * 60;
            isRunning = false;
            timerStartBtn.textContent = 'Start';
            timerStatus.textContent = 'Ready to focus?';
            updateTimerDisplay();
        }

        timerStartBtn.addEventListener('click', startTimer);
        document.getElementById('timer-reset').addEventListener('click', resetTimer);

        // --- NOTES LOGIC ---
        const noteEditor = document.getElementById('note-editor');
        noteEditor.value = state.notes;

        window.saveNotes = () => {
            state.notes = noteEditor.value;
            saveState();
            const saveBtn = document.querySelector('button[onclick="saveNotes()"]');
            saveBtn.textContent = "Saved!";
            setTimeout(() => { saveBtn.textContent = "Save"; }, 2000);
        };

        // --- DATA EXPORT ---
        window.exportData = () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "taris_backup.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        };

        // --- INITIALIZATION ---
        applyTheme();
        renderTasks();
        statsPomosEl.textContent = state.stats.pomos;
    </script>
</body>
</html>
